name: sync-rosters

# Nightly during the season (Aug–Jan), weekly (Mondays) in the offseason.
on:
  schedule:
    - cron: "17 9 * 8-12,1 *"
    - cron: "17 9 * 2-7 1"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill the last 6 seasons (first run)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm sync:rosters ${{ inputs.backfill && '--backfill' || '' }}
